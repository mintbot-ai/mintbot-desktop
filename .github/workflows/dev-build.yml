# Publish a dev build of main (scripts/release-dev.sh) on every push. Signed
# by the dev key (secret AXP_DEV_SIGNING_KEY), which only mintbot.dev's key
# directory lists; the release key never leaves the publisher's machine.
#
# A release is cut from a commit that is pushed to main first, so the push
# already publishes the dev build that keeps a dev build the newest candidate
# of the hosts tracking dev. The release event used to start a second build
# of that same commit; its DEV package run then retired the first build's run
# mid-journey and left a half-tested package on the testbed (2026-10-28).
name: dev build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-build
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the axp CLI
        # Pinned: the signing tool is part of what a dev build is trusted for.
        run: pip install "axp[crypto] @ git+https://github.com/mintbot-ai/agent-extension@2c5784563b658d4e075e52d65bc8bd61b403e7b2"
      - name: Publish the dev build
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_SIGNING_KEY: ${{ secrets.AXP_DEV_SIGNING_KEY }}
          # A push builds its own commit; a manual run builds main.
          COMMIT: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          key="${RUNNER_TEMP}/dev-signing.key"
          (umask 077 && printf '%s\n' "${DEV_SIGNING_KEY}" > "${key}")
          trap 'rm -f "${key}"' EXIT
          AXP_SIGNING_KEY="${key}" scripts/release-dev.sh ${COMMIT}
      - name: Queue the DEV Beaver package tests for this build
        # The build's completion, not the push, starts the tests: Beaver's
        # axp_packages journeys install whatever the newest dev builds are when
        # the run starts. DEV CatOffice queues one run, and its runner's
        # newest-wins rule retires an older queued or in-flight package run, so
        # two quick builds end in one run proving the newest pair. The token
        # opens exactly this route on DEV (mintbot's apply.py mints it; the
        # flow: mintbot developer_tools/agent_skills/axp_package_release.md).
        # A failed report fails the workflow while the dev build stays
        # published: press CatOffice -> Beaver -> Run AXP package tests.
        env:
          DEV_BUILD_TOKEN: ${{ secrets.BEAVER_DEV_BUILD_TOKEN }}
          VERSION: ${{ steps.publish.outputs.version }}
          COMMIT: ${{ steps.publish.outputs.commit }}
        run: |
          [ -n "${DEV_BUILD_TOKEN}" ] || { echo "the BEAVER_DEV_BUILD_TOKEN secret is not set: the DEV package tests were not queued" >&2; exit 1; }
          [ -n "${VERSION}" ] || { echo "release-dev.sh reported no version: the DEV package tests were not queued" >&2; exit 1; }
          body="$(jq -nc --arg package mintbot-desktop --arg version "${VERSION}" --arg commit "${COMMIT}" \
            '{package: $package, version: $version, commit: $commit}')"
          curl --silent --show-error --fail-with-body --retry 3 --max-time 30 \
            --header "X-Dashboard-Token: ${DEV_BUILD_TOKEN}" --header 'Content-Type: application/json' \
            --data "${body}" https://cat.mintbot.dev/api/beaver/dev-build
          echo
